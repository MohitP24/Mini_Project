server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: sentinel-gateway
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sentinel}?stringtype=unspecified
    username: ${POSTGRES_USER:sentinel_app}
    password: ${POSTGRES_PASSWORD:sentinel}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_POOL_MINIMUM_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAXIMUM_SIZE:20}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  cloud:
    gateway:
      routes:
        - id: mock-payment-service
          uri: ${MOCK_PAYMENT_URL:http://localhost:9001}
          predicates:
            - Path=/api/payments/**
        - id: mock-user-service
          uri: ${MOCK_USER_URL:http://localhost:9002}
          predicates:
            - Path=/api/users/**
        - id: mock-admin-service
          uri: ${MOCK_ADMIN_URL:http://localhost:9003}
          predicates:
            - Path=/api/admin/**

sentinel:
  jwt:
    private-key-path: ${SENTINEL_JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${SENTINEL_JWT_PUBLIC_KEY_PATH:}
    private-key-b64: ${SENTINEL_JWT_PRIVATE_KEY_B64:}
    public-key-b64: ${SENTINEL_JWT_PUBLIC_KEY_B64:}
    issuer: ${SENTINEL_JWT_ISSUER:sentinel-auth}
    audience: ${SENTINEL_JWT_AUDIENCE:sentinel-api}
    algorithm: ${SENTINEL_JWT_ALGORITHM:RS256}
  gateway:
    public-endpoints: ${GATEWAY_PUBLIC_ENDPOINTS:/actuator/health,/actuator/info,/login}
    version: ${GATEWAY_VERSION:3.0.0}

management:
  endpoints:
    web:
      exposure:
        include: "*"
